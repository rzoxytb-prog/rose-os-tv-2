plugins { id 'com.android.application' }

android {
    namespace 'com.rose.tvos'
    compileSdk 34
    defaultConfig {
        applicationId "com.rose.tvos"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    // L'interface est partagée : le dossier /web sert aussi de dossier "assets" Android
    sourceSets { main { assets.srcDirs = ['../web'] } }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
